name = "beamline"
main = "beamline.js"
compatibility_date = "2026-08-19"

# 200s are stored in caches.default (Cloudflare Cache API) by beamline.js.
# SCAN_URL is not stored here; make deploy-cf passes it from the environment.

# logLine emits one object per lookup carrying `src`, which names the layer
# that answered — cache, kv, or scan. Workers Logs
# indexes those fields, so the cache hit rate is a query rather than a guess.
# The default KV namespace title is `beamline`. `make deploy-cf` receives its
# account-specific ID through KV and materializes the binding for deployment:
#   npx wrangler kv namespace create beamline
[observability]
enabled = true
head_sampling_rate = 1

[vars]
MAX_BYTES = "16777216"
SCAN_TIMEOUT_MS = "1800000"
# How long a verdict stays in caches.default. Short while the service is still
# moving; raise it once the answers have settled.
VERDICT_MAX_AGE = "3600"
# How long a verdict stays in Workers KV, the layer behind it. Measured from the
# write; a read does not extend it. Written without an expiry a verdict is
# stored forever, and a key whose spelling stops being read is never reclaimed.
KV_MAX_AGE = "7776000"
